function cutGeometry(w,h,wide,feed){

function cutTray(w,h,wide){var x=w*(wide?.055:.07),y=h*(wide?.79:.545),width=w*(wide?.4:.86),height=h*(wide?.18:.115),cell=width/6,row=height/3;return{x:x,y:y,width:width,height:height,cell:cell,row:row,rx:Math.min(21,cell*.38,row*.66),ry:Math.min(17,cell*.30,row*.48)};}
function piece(c,x,y,rx,ry,width,angle){var thick=Math.max(1.5,Math.min(rx*.95,width*rx/90));c.save();c.translate(x,y);c.rotate(angle||0);var g=c.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,'#fff4dc');g.addColorStop(.4,'#f4a3af');g.addColorStop(1,'#ae6b83');c.fillStyle=g;c.beginPath();c.ellipse(-thick,0,rx,ry,0,0,7);c.fill();c.fillRect(-thick,-ry,thick,ry*2);face(c,0,0,rx,ry);c.restore();}

function update(dt){tick+=dt;slices.forEach(function(s){s.age=Math.min(.25,s.age+dt);});knife=Math.max(0,knife-dt);pop=Math.max(0,pop-dt);shake=Math.max(0,shake-dt*25);for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}if(state==='cut'){countdown=Math.max(0,origin-clock());elapsed=Math.max(0,clock()-origin);if(elapsed>=16.2)finish();}if(ac&&!muted&&(state==='design'||state==='cut')){if(nextNote<ac.currentTime-.2)nextNote=ac.currentTime;if(nextNote<ac.currentTime+.08){var freq=[523.25,587.33,659.25,783.99,880,783.99,659.25,587.33][noteIndex%8];tone(freq,state==='design'?.45:.16,Math.max(0,nextNote-ac.currentTime),state==='design'?.025:.035);noteIndex++;nextNote+=state==='design'?.75:.45;}}}

if(state==='cut'){var gx=land?w*.07:w*.1,gy=h*(land?.39:.23),gw=land?w*.4:w*.8;round(ctx,gx,gy,gw,57,16,'#fffaf0');var frac=((elapsed*36-lastCut)/32.4),center=gx+gw*.5,unit=gw*.27;ctx.save();ctx.beginPath();ctx.rect(gx,gy,gw,57);ctx.clip();if(slices.length<12){ctx.fillStyle=slices.length<6?'#50b7ad3d':'#50b7ad19';ctx.fillRect(center-unit*.10,gy,unit*.20,57);}for(var j=-4;j<8;j++){var mx=center+(j+1-frac)*unit;ctx.strokeStyle='#9caba4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mx,gy+12);ctx.lineTo(mx,gy+41);ctx.stroke();}ctx.restore();ctx.fillStyle='#e8798e';ctx.beginPath();ctx.moveTo(center-6,gy-5);ctx.lineTo(center+6,gy-5);ctx.lineTo(center,gy+5);ctx.fill();text('ここで切る',center,gy+75,13,'#766157');var feed=Math.max(0,elapsed*36-lastCut),latest=slices[slices.length-1];if(latest&&latest.age<.25)feed+=latest.width*Math.pow(1-latest.age/.25,3);var geom=cutGeometry(w,h,land,feed),rx=geom.x,ry=geom.y,sz=geom.size,ct=cutTray(w,h,land);round(ctx,ct.x,ct.y,ct.width,ct.height,12,'#e8d9bc');round(ctx,ct.x+3,ct.y+3,ct.width-6,ct.height-6,10,'#fffaf0');ctx.save();ctx.translate(Math.sin(tick*57)*shake,Math.cos(tick*63)*shake);ctx.fillStyle='#72533816';ctx.beginPath();ctx.ellipse(rx,ry+sz*.7,sz*1.8,sz*.33,-.2,0,7);ctx.fill();rod(ctx,rx,ry,sz,geom.feed);for(var si=0;si<slices.length;si++){var sl=slices[si],tx=ct.x+ct.cell*(si%6+.5),ty=ct.y+ct.row*(Math.floor(si/6)+.5);if(sl.age>=.25){piece(ctx,tx,ty,ct.rx,ct.ry,sl.width,(si%3-1)*.07);}else{var t=sl.age/.25,e=1-Math.pow(1-t,3),start=cutGeometry(w,h,land,sl.width);piece(ctx,start.tipX*(1-e)+tx*e,start.tipY*(1-e)+ty*e-Math.sin(t*Math.PI)*12,sz*.55*(1-e)+ct.rx*e,sz*.48*(1-e)+ct.ry*e,sl.width,geom.angle*(1-e));}}var plunge=knife>0?Math.sin((1-knife/.18)*Math.PI):0,kx=geom.tipX-Math.sin(.18)*38,ky=geom.tipY-Math.cos(.18)*38-38*(1-plunge);ctx.save();ctx.translate(kx,ky);ctx.rotate(-.18);var steel=ctx.createLinearGradient(0,0,0,58);steel.addColorStop(0,'#d5e0dd');steel.addColorStop(.7,'#fff');steel.addColorStop(1,'#9caeaa');round(ctx,-52,-20,100,58,7,steel);ctx.fillStyle='#243d46';ctx.fillRect(34,-14,48,16);ctx.fillStyle='#bb9e6d';ctx.fillRect(40,-11,35,3);ctx.restore();ctx.restore();var overdue=frac>1,phase=overdue?(.5+.5*Math.sin(tick*8)):Math.max(0,frac);var beatX=gx+gw-22,beatY=gy-28;ctx.fillStyle=overdue?'#dc633f':'#50b7ad';ctx.globalAlpha=.08+.14*phase;ctx.beginPath();ctx.arc(beatX,beatY,22,0,7);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=overdue?'#dc633f':'#50b7ad';ctx.lineWidth=slices.length<6&&frac>=.8&&frac<=1?5:3;ctx.beginPath();ctx.arc(beatX,beatY,12+6*(1-phase),0,7);ctx.stroke();if(overdue&&countdown<=0){text('目標を過ぎた・切って次へ',land?w*.76:w*.5,gy+96,13,'#dc633f');}if(countdown>0){text('約16秒で完成・18枚を目指そう',rx,ry+62,13,'#766157');round(ctx,rx-46,ry-44,92,88,24,'#fffaf0ed');text(String(Math.ceil(countdown/.6)),rx,ry+17,48,'#e8798e');}else if(pop>0){ctx.globalAlpha=Math.min(1,pop*5);text(label,land?w*.75:w*.5,h*(land?.48:.515)-(1-pop/.65)*8,land?27:24,labelColor);ctx.globalAlpha=1;}var bx=land?w*.57:w*.15,by=h*(land?.61:.95),bw=land?w*.35:w*.7;round(ctx,bx,by,bw,4,2,'#dfd5bf');round(ctx,bx,by,bw*Math.max(0,1-elapsed/16.2),4,2,'#50a99f');text('完成まで あと'+Math.ceil(Math.max(0,16.2-elapsed))+'秒',bx+bw/2,by-9,13,'#766157');}
if(state==='result'){tray(ctx,land?w*.05:w*.06,h*(land?.18:.36),land?w*.43:w*.88,h*(land?.64:.29),slices.length);text('ひと切れずつ、私のもよう。',land?w*.265:w*.5,h*(land?.9:.69)-16,13,'#766157');}ctx.restore();for(var k=0;k<particles.length;k++){var p=particles[k];ctx.globalAlpha=p.life*2;ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*8);ctx.fillRect(-3,-3,6,6);ctx.restore();}ctx.globalAlpha=1;}
